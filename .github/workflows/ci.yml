name : CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image : postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB : url_shortener_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d url_shortener_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:

        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/url_shortener_test
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/url_shortener_test

        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0

        BASE_URL: http://localhost:8000

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t url-shortener:latest .